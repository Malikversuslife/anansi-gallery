<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anansi Gallery</title><link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css"><style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono&display=swap');:root{--bg:#f5f3ee;--paper:#fffefa;--ink:#252724;--line:#dddcd4;--muted:#757870;--teal:#337e78;--pale:#dcefed;--amber:#c58c2d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px 'DM Sans'}.app{padding-left:248px;min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:248px;padding:24px 15px;overflow:auto;display:flex;flex-direction:column;border-right:1px solid var(--line)}.logo{font-size:24px;font-weight:700;padding:0 9px}.logo small,.label{display:block;font:10px 'DM Mono';letter-spacing:1.2px;color:var(--muted);margin-top:4px}.gallery{margin:23px 0 17px;padding:12px;background:#edede6;border-radius:7px;font-size:12px}.gallery b{display:block}.gallery span{font-size:11px;color:var(--muted)}nav{display:grid;gap:4px}nav button{border:0;background:none;color:#5e625d;text-align:left;padding:11px 10px;border-radius:6px;font:14px 'DM Sans';display:flex;gap:11px;align-items:center}nav i{font-size:18px}nav button.active,nav button:hover{background:var(--pale);color:#286d68;font-weight:600}.label{margin:25px 10px 8px}.user{margin-top:auto;border-top:1px solid var(--line);padding:17px 5px 0;display:flex;gap:10px}.av{width:32px;height:32px;border-radius:50%;background:#d8e5df;color:var(--teal);display:grid;place-items:center;font-size:11px;font-weight:700}.user b{font-size:12px}.user span{display:block;color:var(--muted);font-size:10px}main{padding:35px 42px;max-width:1360px}.head{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:27px}.eyebrow{font:10px 'DM Mono';letter-spacing:1.2px;color:var(--teal);margin-bottom:9px}.head h1{margin:0;font-size:32px;letter-spacing:-1px}.head p{margin:6px 0;color:var(--muted)}.btn{border:1px solid var(--line);border-radius:6px;background:var(--paper);padding:10px 14px;font:600 12px 'DM Sans';display:inline-flex;gap:7px;align-items:center}.primary{background:var(--teal);border-color:var(--teal);color:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:27px 0}.card,.list{background:var(--paper);border:1px solid var(--line);border-radius:9px}.card{padding:18px}.card b{display:block;font-size:28px;margin:8px 0}.card span,.card p,small{color:var(--muted);font-size:12px}.section{border-top:1px solid var(--ink);margin-top:27px;padding-top:15px}.section h2{font-size:17px;margin:0 0 16px}.row{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:14px}.row:last-child{border:0}.row b{display:block}.tag{padding:4px 7px;border-radius:10px;background:var(--pale);color:var(--teal);font-size:10px;font-weight:600}.muted{color:var(--muted);font-size:12px}.split{display:grid;grid-template-columns:1fr 1fr;gap:15px}.notice{margin:25px 0;background:var(--paper);border-radius:9px;padding:17px;border:1px solid var(--line)}.notice b{display:block}.notice span{font-size:12px;color:var(--muted)}.empty{padding:32px;text-align:center;color:var(--muted)}dialog{border:0;border-radius:10px;box-shadow:0 20px 70px #0004;width:min(500px,90vw);padding:0;background:var(--paper)}dialog::backdrop{background:#20252070}.modal{padding:22px}.modal h2{margin:0 0 18px}.form{display:grid;gap:13px}.form label{font:10px 'DM Mono';letter-spacing:.8px;color:var(--muted)}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:6px;background:white;font:13px 'DM Sans';margin-top:6px}textarea{height:78px}.modalActions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.toast{position:fixed;right:24px;bottom:24px;background:var(--ink);color:#fff;padding:13px 16px;border-radius:6px;opacity:0;transition:.2s}.toast.show{opacity:1}@media(max-width:850px){.app{padding:0}.side{position:static;width:auto;height:auto;flex-direction:row;align-items:center}.gallery,nav,.label,.user div+div{display:none}.user{margin:0 0 0 auto;border:0;padding:0}main{padding:24px 20px}.grid,.split{grid-template-columns:1fr}}</style></head><body><div class="app"><aside class="side"><div class="logo">anansi<small>VIRTUAL GALLERY</small></div><div class="gallery"><b>ANANSI GALLERY</b><span>Lagos · Private workspace</span></div><nav id="nav"><button data-page="overview"><i class="hgi-stroke hgi-home-01"></i>Overview</button><button data-page="exhibitions"><i class="hgi-stroke hgi-grid-view"></i>Exhibitions</button><button data-page="artists"><i class="hgi-stroke hgi-user-group"></i>Artists</button><button data-page="artworks"><i class="hgi-stroke hgi-image-01"></i>Artworks</button><button data-page="enquiries"><i class="hgi-stroke hgi-message-01"></i>Collector enquiries</button></nav><div class="label">MANAGEMENT</div><nav><button data-page="theme"><i class="hgi-stroke hgi-paint-board"></i>Gallery theme</button><button data-page="settings"><i class="hgi-stroke hgi-settings-01"></i>Settings</button></nav><div class="user"><div class="av">AO</div><div><b>Adesewa Okafor</b><span>Gallery Director</span></div></div></aside><main id="main"></main></div><dialog id="modal"><div class="modal"><h2 id="modalTitle"></h2><form class="form" id="form"></form><div class="modalActions"><button class="btn" type="button" onclick="modal.close()">Cancel</button><button class="btn primary" id="save" type="button">Save</button></div></div></dialog><div class="toast" id="toast"></div><script>const initial={theme:'Museum quiet',settings:{name:'Anansi Gallery',email:'hello@anansi.gallery'},artists:[{name:'Amaka Eze',works:3},{name:'Olamide Soyinka',works:2}],works:[{name:'Red Room, Still',artist:'Amaka Eze',price:'₦650,000',status:'Available'},{name:'Water has a memory',artist:'Olamide Soyinka',price:'₦480,000',status:'Reserved'}],shows:[{title:'Things that remain after the rain',status:'Collector preview',works:2}],leads:[{name:'Nneka O.',interest:'Red Room, Still',status:'New'},{name:'James M.',interest:'Preview appointment',status:'New'}]};let d=JSON.parse(localStorage.getItem('anansiData')||'null')||initial,page=location.hash.slice(1)||'overview';const $=x=>document.querySelector(x),save=()=>localStorage.setItem('anansiData',JSON.stringify(d)),toast=x=>{let t=$('#toast');t.textContent=x;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1700)},row=(a,b,c)=>`<div class="row"><div><b>${a}</b><small>${b}</small></div>${c||''}</div>`,button=(t,a)=>`<button class="btn primary" onclick="${a}">${t}</button>`;function list(items,kind){return items.length?`<div class="list">${items.map((x,i)=>kind==='artist'?row(x.name,`${x.works} works in catalogue`,button('Edit',`editArtist(${i})`)):kind==='work'?row(x.name,`${x.artist} · ${x.price}`,`<span class="tag">${x.status}</span>`):kind==='lead'?row(x.name,x.interest,`<button class="btn" onclick="advanceLead(${i})">${x.status}</button>`):row(x.title,`${x.works} works`, `<span class="tag">${x.status}</span>`)).join('')}</div>`:`<div class="card empty">No records yet.</div>`}function render(){let content={overview:`<header class="head"><div><div class="eyebrow">GALLERY CONTROL</div><h1>Overview</h1><p>Live curator workspace.</p></div>${button('Create exhibition','newShow()')}</header><div class="grid"><div class="card"><span>EXHIBITIONS</span><b>${d.shows.length}</b><small>Current gallery shows</small></div><div class="card"><span>ARTWORKS</span><b>${d.works.length}</b><small>Available or reserved</small></div><div class="card"><span>ENQUIRIES</span><b>${d.leads.length}</b><small>Collector leads</small></div></div><div class="notice"><b>Start a complete exhibition flow</b><span>Create a show, add artists and artworks, choose its theme, then publish it to collector preview.</span></div>`,exhibitions:`<header class="head"><div><div class="eyebrow">CURATION</div><h1>Exhibitions</h1><p>Create, edit and publish shows.</p></div>${button('New exhibition','newShow()')}</header><div class="section"><h2>Your exhibitions</h2>${list(d.shows,'show')}</div>`,artists:`<header class="head"><div><div class="eyebrow">ROSTER</div><h1>Artists</h1><p>Build your represented artist list.</p></div>${button('Add artist','newArtist()')}</header><div class="section"><h2>Artists</h2>${list(d.artists,'artist')}</div>`,artworks:`<header class="head"><div><div class="eyebrow">CATALOGUE</div><h1>Artworks</h1><p>Set price, availability and artist.</p></div>${button('Add artwork','newWork()')}</header><div class="section"><h2>Catalogue</h2>${list(d.works,'work')}</div>`,enquiries:`<header class="head"><div><div class="eyebrow">COLLECTORS</div><h1>Collector enquiries</h1><p>Move every lead through a clear follow-up path.</p></div></header><div class="section"><h2>Interest queue</h2>${list(d.leads,'lead')}</div>`,theme:`<header class="head"><div><div class="eyebrow">SPACE</div><h1>Gallery theme</h1><p>Choose the atmosphere used by new exhibitions.</p></div></header><div class="grid">${['Museum quiet','Nocturne','Earth room'].map(x=>`<div class="card"><span>${x.toUpperCase()}</span><b>${d.theme===x?'Selected':'Choose'}</b><p>${x==='Museum quiet'?'Soft stone & daylight':x==='Nocturne'?'Dark walls & focus':'Warm plaster & glow'}</p><button class="btn" onclick="setTheme('${x}')">Use theme</button></div>`).join('')}</div>`,settings:`<header class="head"><div><div class="eyebrow">ADMINISTRATION</div><h1>Settings</h1><p>Gallery identity and collector contact.</p></div></header><div class="section"><div class="split"><label>GALLERY NAME<input id="setName" value="${d.settings.name}"></label><label>COLLECTOR CONTACT EMAIL<input id="setEmail" value="${d.settings.email}"></label></div><p><button class="btn primary" onclick="saveSettings()">Save settings</button></p></div>`};$('#main').innerHTML=content[page];document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===page))}function fields(a){$('#form').innerHTML=a.map(x=>`<label>${x[0]}<input id="f${x[1]}" placeholder="${x[2]||''}"></label>`).join('')}function open(t,f,fn){$('#modalTitle').textContent=t;fields(f);$('#save').onclick=fn;modal.showModal()}function newShow(){open('Create exhibition',[['Title','title','New exhibition']],()=>{d.shows.push({title:$('#ftitle').value||'Untitled exhibition',status:'Draft',works:0});save();modal.close();page='exhibitions';render();toast('Exhibition created.')})}function newArtist(){open('Add artist',[['Artist name','name','Full name']],()=>{d.artists.push({name:$('#fname').value||'Untitled artist',works:0});save();modal.close();render();toast('Artist added.')})}function editArtist(i){open('Update artist',[['Artist name','name',d.artists[i].name]],()=>{d.artists[i].name=$('#fname').value||d.artists[i].name;save();modal.close();render();toast('Artist updated.')})}function newWork(){open('Add artwork',[['Artwork title','title','Title'],['Artist','artist','Artist name'],['Price','price','₦0']],()=>{d.works.push({name:$('#ftitle').value||'Untitled work',artist:$('#fartist').value||'Unassigned',price:$('#fprice').value||'Price on request',status:'Available'});save();modal.close();render();toast('Artwork added.')})}function advanceLead(i){d.leads[i].status=d.leads[i].status==='New'?'Contacted':d.leads[i].status==='Contacted'?'Resolved':'New';save();render();toast('Lead marked '+d.leads[i].status+'.')}function setTheme(x){d.theme=x;save();render();toast('Default theme updated.')}function saveSettings(){d.settings.name=$('#setName').value;d.settings.email=$('#setEmail').value;save();toast('Settings saved.')}document.querySelectorAll('[data-page]').forEach(x=>x.onclick=()=>{page=x.dataset.page;location.hash=page;render()});addEventListener('hashchange',()=>{page=location.hash.slice(1)||'overview';render()});render();</script></body></html>
