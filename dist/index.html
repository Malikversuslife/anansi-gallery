  <style>

:auto;font-size:11px}.search{height:34px;width:200px;border:0;border-radius:18px;padding:0 14px;background:#fff;outline:0}.btn{height:40px;padding:0 15px;border:1px solid #dfe8e9;background:#fff;border-radius:9px;color:#395052;font:600 12px 'DM Sans';display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;white-space:nowrap}.btn:hover{border-color:#a7cecc}.btn.primary{background:var(--teal);color:#fff;border-color:var(--teal)}.btn.small{height:32px;border-radius:8px;padding:0 11px;font-size:11px}.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) 295px;gap:20px}.stage{min-height:322px;position:relative;overflow:hidden;border-radius:20px;background:url("assets/gallery-hero.png") center/cover}.stage:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#f9ffffe8 0%,#f9ffff8c 45%,transparent 74%)}.stage-copy{position:relative;z-index:1;padding:26px}.eyebrow{font:10px 'DM Mono';letter-spacing:1px;color:var(--teal);margin-bottom:9px}.stage h1{font-size:29px;letter-spacing:-1.4px;line-height:1.06;margin:0;max-width:280px}.stage p{max-width:245px;color:#607477;line-height:1.5;margin:11px 0 19px}.metric-row{display:flex;gap:35px;margin:20px 0}.metric span{color:#6d8184;font-size:10px;display:block}.metric b{font-size:25px;letter-spacing:-1px;display:block;margin-top:2px}.mini-cards{display:flex;gap:10px}.mini{width:150px;padding:13px;border-radius:12px}.mini.lime{background:#deefc8}.mini.aqua{background:#b8e5ea}.mini span{display:block;font-size:10px;color:#53696b}.mini b{font-size:20px;letter-spacing:-1px;display:block;margin:12px 0 6px}.bar{height:4px;border-radius:4px;background:#ffffff91;overflow:hidden}.bar i{display:block;height:100%;width:68%;border-radius:4px;background:#709d79}.aqua .bar i{background:#4e9fa5;width:51%}.showcase{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px;min-height:322px}.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.section-title h2{font-size:15px;margin:0;letter-spacing:-.3px}.link-btn{border:0;background:transparent;color:var(--teal);font:600 11px 'DM Sans';cursor:pointer}.work-card{width:100%;border:0;background:none;padding:0;text-align:left;font:inherit;cursor:pointer;margin-bottom:13px}.work-thumb{height:102px;border-radius:10px;position:relative;overflow:hidden;background:linear-gradient(130deg,#d66654,#f0bd83 52%,#243f3d)}.work-thumb.two{background:radial-gradient(circle at 20% 30%,#e8e2b0 0 13%,transparent 14%),linear-gradient(135deg,#162f3d,#477873 52%,#d2be91)}.work-thumb:after{content:"";position:absolute;inset:13px 28% 13px 15%;border:2px solid #ffffffa8;transform:rotate(-8deg)}.work-card b{font-size:12px;display:block;margin-top:8px}.work-card small{color:var(--muted);font-size:10px}.below{display:grid;grid-template-columns:1fr 1.05fr 295px;gap:20px;margin-top:20px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:17px}.brand-card{min-height:214px;background:linear-gradient(145deg,#fff,#f0fafb);position:relative;overflow:hidden}.brand-card:after{content:"";position:absolute;width:130px;height:130px;border:18px solid #b9e6e7;border-radius:50%;right:-35px;top:-35px}.brand-card h2{font-size:19px;letter-spacing:-.8px;max-width:180px;position:relative;z-index:1;margin:37px 0 10px}.brand-card p{font-size:11px;line-height:1.55;color:var(--muted);max-width:190px}.stat-box{background:#f6fafb;border-radius:12px;padding:13px;margin-top:16px;display:flex;justify-content:space-between}.stat-box b{font-size:21px;letter-spacing:-1px}.stat-box span{color:var(--muted);font-size:10px}.activity .section-title{margin-bottom:14px}.activity-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #edf1f1}.activity-row:first-of-type{border:0}.tiny-av{width:30px;height:30px;border-radius:50%;background:#dceeea;display:grid;place-items:center;color:#407a74;font-size:10px;font-weight:bold}.activity-row b{display:block;font-size:1 id var(--line);border-radius:8px;font:13px 'DM Sans'}dialog{border:0;border-radius:18px;padding:0;width:min(470px,90vw);box-shadow:0 25px 80px #172c2f55}dialog::backdrop{background:#172b2c77}.modal{padding:22px;background:#fff}.modal h2{font-size:20px;letter-spacing:-.6px;margin:0 0 18px}.form{display:grid;gap:13px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.modal-art{display:grid;grid-template-columns:1fr 1fr;gap:18px}.art-large{border-radius:12px;min-height:205px;background:linear-gradient(130deg,#d66654,#f0bd83 52%,#243f3d);position:relative}.art-large:after{content:"";position:absolute;inset:28px;border:3px solid #fff9;transform:rotate(-8deg)}.toast{position:fixed;right:28px;bottom:28px;background:#183334;color:#fff;border-radius:10px;padding:12px 15px;opacity:0;transform:translateY(9px);transition:.2s}.toast.show{opacity:1;transform:none}@media(max-width:950px){.shell{width:calc(100% - 24px);margin:12px auto;min-height:calc(100vh - 24px)}.topnav{display:none}.hero-grid,.below{grid-template-columns:1fr}.showcase{display:grid;grid-template-columns:1fr 1fr;gap:12px}.showcase .section-title{grid-column:1/-1}.work-card{margin:0}.content{padding:20px}.profile-link div{display:none}}@media(max-width:560px){.topbar{padding:0 16px}.top-actions .icon-btn{display:none}.utility .search{display:none}.metric-row{gap:18px}.mini-cards{display:none}.stage{min-height:270px}.showcase,.theme-grid,.settings-grid,.modal-art{grid-template-columns:1fr}.page-head{gap:14px}.page-head .btn{padding:0 10px}.content{padding:16px}.shell{border-radius:18px}.row{flex-wrap:wrap}}
    /* Product-wide canvas: keep the dashboard's coloured surface, not a photo. */
    body{background:linear-gradient(145deg,#dcecee,#c3dcdf)}
    body:before{display:none}
    body:after{pointer-events:none}
    body{overflow:hidden}
    .shell{width:100%;height:100dvh;min-height:100dvh;margin:0;border:0;border-radius:0;overflow:hidden}
    .topbar{position:relative;top:auto;z-index:20;box-shadow:0 1px 0 var(--line)}
    .content{height:calc(100dvh - 72px);overflow-y:auto}
    .btn.danger{color:#a2463e;border-color:#edcac5;background:#fff}
    .btn.danger:hover{background:#fff3f1;border-color:#d8958c}
    .form textarea{width:100%;min-height:96px;margin-top:7px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;resize:vertical;font:13px 'DM Sans';color:var(--ink)}
    .form input[type=file]{padding:9px;height:auto;background:#f7fbfb}
    .form select,.placement-select{width:100%;height:42px;margin-top:7px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font:13px 'DM Sans'}
    .placement-studio{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.gallery-map{min-height:330px;padding:22px;background:linear-gradient(140deg,#f3fafb,#e2eff0);border:1px solid var(--line);border-radius:17px;position:relative}.gallery-map h2{font-size:16px;margin:0}.gallery-map p{color:var(--muted);font-size:11px}.zone{position:absolute;border:1px dashed #6ca3a2;background:#ffffffaa;border-radius:10px;padding:9px;color:#497b7a;font-size:10px;font-weight:700}.zone.north{top:76px;left:24%;right:24%}.zone.south{bottom:22px;left:24%;right:24%}.zone.west{left:18px;top:39%;bottom:25%;display:flex;align-items:center}.zone.east{right:18px;top:39%;bottom:25%;display:flex;align-items:center}.zone.plinth{width:90px;height:90px;left:calc(50% - 45px);top:calc(50% - 18px);border-radius:50%;display:grid;place-items:center;text-align:center}.placement-list{max-height:420px;overflow:auto}.placement-list .row{align-items:flex-start}.placement-list .row select{width:145px;margin:0}
    @media(max-width:750px){.placement-studio{grid-template-columns:1fr}.gallery-map{min-height:285px}.placement-list{max-height:none}}
    .mobile-menu,.drawer,.drawer-backdrop{display:none}
    @media(max-width:950px){.mobile-menu{display:inline-flex}.drawer{display:block;position:fixed;z-index:50;top:0;left:0;width:282px;height:100dvh;padding:24px 15px;background:#f9fcfd;box-shadow:18px 0 50px #19363825;transform:translateX(-105%);transition:transform .22s}.drawer.open{transform:translateX(0)}.drawer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:27px}.drawer .brand{font-size:23px}.drawer-nav{display:grid;gap:5px}.drawer-nav button{height:44px;border:0;border-radius:10px;background:transparent;color:#526467;padding:0 12px;text-align:left;font:600 13px 'DM Sans';display:flex;align-items:center;gap:10px}.drawer-nav button:hover,.drawer-nav button.active{background:#e3f2f2;color:var(--teal)}.drawer-backdrop.open{display:block;position:fixed;z-index:45;inset:0;background:#1830325e}.topbar{gap:12px}.brand{margin-right:auto}.top-actions{gap:6px}.top-actions .icon-btn{display:none}.top-actions .mobile-menu{display:inline-flex}.profile-link{margin-left:0}}
  </style>

<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><i class="hgi-stroke hgi-sparkles"></i>anansi</div>
      <nav class="topnav" id="nav">
        <button data-page="overview"><i class="hgi-stroke hgi-home-01"></i>Home</button>
        <button data-page="exhibitions"><i class="hgi-stroke hgi-grid-view"></i>Exhibitions</button>
        <button data-page="artists"><i class="hgi-stroke hgi-user-group"></i>Artists</button>
        <button data-page="artworks"><i class="hgi-stroke hgi-image-01"></i>Artworks</button>
        <button data-page="enquiries"><i class="hgi-stroke hgi-message-01"></i>Enquiries</button>
      </nav>
      <div class="top-actions">
        <button class="icon-btn mobile-menu" title="Open navigation" onclick="toggleDrawer()"><i class="hgi-stroke hgi-menu-01"></i></button>
        <button class="icon-btn" title="Gallery theme" onclick="go('theme')"><i class="hgi-stroke hgi-paint-board"></i></button>
        <button class="icon-btn" title="Settings" onclick="go('settings')"><i class="hgi-stroke hgi-settings-01"></i></button>
        <a class="profile-link" href="profile.html"><span class="avatar" id="avatar">AO</span><div><b id="profileName">Adesewa Okafor</b><small>Gallery Director</small></div></a>
      </div>
    </header>
    <div class="drawer-backdrop" id="drawerBackdrop" onclick="toggleDrawer(false)"></div>
    <aside class="drawer" id="drawer">
      <div class="drawer-head"><div class="brand"><i class="hgi-stroke hgi-sparkles"></i>anansi</div><button class="icon-btn" title="Close navigation" onclick="toggleDrawer(false)"><i class="hgi-stroke hgi-cancel-01"></i></button></div>
      <nav class="drawer-nav">
        <button data-page="overview"><i class="hgi-stroke hgi-home-01"></i>Overview</button>
        <button data-page="exhibitions"><i class="hgi-stroke hgi-grid-view"></i>Exhibitions</button>
        <button data-page="artists"><i class="hgi-stroke hgi-user-group"></i>Artists</button>
        <button data-page="artworks"><i class="hgi-stroke hgi-image-01"></i>Artworks</button>
        <button data-page="placement"><i class="hgi-stroke hgi-location-01"></i>Placement studio</button>
        <button data-page="enquiries"><i class="hgi-stroke hgi-message-01"></i>Collector enquiries</button>
        <button data-page="theme"><i class="hgi-stroke hgi-paint-board"></i>Gallery theme</button>
        <button data-page="settings"><i class="hgi-stroke hgi-settings-01"></i>Settings</button>
      </nav>
    </aside>
    <main class="content">
      <section class="view" id="overview"></section><section class="view" id="exhibitions"></section><section class="view" id="artists"></section><section class="view" id="artworks"></section><section class="view" id="placement"></section><section class="view" id="enquiries"></section><section class="view" id="theme"></section><section class="view" id="settings"></section>
    </main>
  </div>
  <dialog id="modal"><div class="modal"><h2 id="modalTitle"></h2><div class="form" id="form"></div><div class="modal-actions"><button class="btn" onclick="modal.close()">Cancel</button><button class="btn primary" id="saveModal">Save</button></div></div></dialog>
  <div class="toast" id="toast"></div>
  <script>
    const initial={theme:'Museum quiet',settings:{name:'Anansi Gallery',email:'hello@anansi.gallery'},artists:[{name:'Amaka Eze',works:3},{name:'Olamide Soyinka',works:2}],works:[{name:'Red Room, Still',artist:'Amaka Eze',price:'₦650,000',status:'Available',note:'Oil and pigment on linen · 2025'},{name:'Water has a memory',artist:'Olamide Soyinka',price:'₦480,000',status:'Reserved',note:'Mixed media · 2025'}],shows:[{title:'Things that remain after the rain',status:'Collector preview',works:2}],leads:[{name:'Nneka O.',interest:'Red Room, Still',status:'New'},{name:'James M.',interest:'Preview appointment',status:'New'}]};
    let data=JSON.parse(localStorage.getItem('anansiData')||'null')||initial; let page=location.hash.slice(1)||'overview'; const $=x=>document.querySelector(x); const persist=()=>localStorage.setItem('anansiData',JSON.stringify(data));
    const escape=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    function toast(message){const t=$('#toast');t.textContent=message;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
    function toggleDrawer(force){const open=typeof force==='boolean'?force:!$('#drawer').classList.contains('open');$('#drawer').classList.toggle('open',open);$('#drawerBackdrop').classList.toggle('open',open)}
    function go(next){toggleDrawer(false);location.hash=next}
    function setProfile(){const p=JSON.parse(localStorage.getItem('anansiProfile')||'{}');const name=p.name||'Adesewa Okafor';$('#profileName').textContent=name;$('#avatar').textContent=name.split(' ').map(x=>x[0]).slice(0,2).join('')}
    const action=(label,js,variant='primary')=>'<button class="btn '+variant+'" onclick="'+js+'">'+label+'</button>';
    const artImageStyle=image=>image?' style="background-image:url('+image+');background-size:cover;background-position:center"':'';
    const placements=['North wall','South wall','East wall','West wall','Atrium plinth','Window plinth','Storage / unplaced'];
    const placementOptions=selected=>placements.map(place=>'<option '+(place===(selected||'Storage / unplaced')?'selected':'')+'>'+place+'</option>').join('');
    function rows(type){const arr=type==='artist'?data.artists:type==='work'?data.works:type==='lead'?data.leads:data.shows;if(!arr.length)return '<div class="row"><small>No records yet.</small></div>';return arr.map((x,i)=>{if(type==='artist')return '<div class="row"><div><b>'+escape(x.name)+'</b><small>'+x.works+' works in catalogue</small></div>'+action('Edit','editArtist('+i+')','small')+action('Remove','removeArtist('+i+')','small danger')+'</div>';if(type==='work')return '<div class="row"><div><b>'+escape(x.name)+'</b><small>'+escape(x.artist)+' · '+escape(x.price)+'</small></div><span class="tag">'+x.status+'</span>'+action('View','openArtwork('+i+')','small')+action('Remove','removeArtwork('+i+')','small danger')+'</div>';if(type==='lead')return '<div class="row"><span class="tiny-av">'+escape(x.name.slice(0,1))+'</span><div><b>'+escape(x.name)+'</b><small>'+escape(x.interest)+'</small></div>'+action(x.status,'advanceLead('+i+')','small')+'</div>';return '<div class="row"><div><b>'+escape(x.title)+'</b><small>'+x.works+' works</small></div><span class="tag">'+x.status+'</span></div>'}).join('')}
    function render(){setProfile();document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));$('#'+page).classList.add('active');document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
      $('#overview').innerHTML='<div class="utility"><span class="date">THURSDAY, 08 OCTOBER, 2026</span><input class="search" placeholder="Search catalogue"><button class="btn small" onclick="go(\'theme\')"><i class="hgi-stroke hgi-paint-board"></i> '+escape(data.theme)+'</button></div><div class="hero-grid"><section class="stage"><div class="stage-copy"><div class="eyebrow">ANANSI GALLERY · LAGOS</div><h1>The room is ready for your next exhibition.</h1><p>Shape the virtual space, ready the works, and welcome your collectors in.</p>'+action('<i class="hgi-stroke hgi-plus-sign"></i> New exhibition','newShow()')+'<div class="metric-row"><div class="metric"><span>ACTIVE SHOWS</span><b>'+data.shows.length+'</b></div><div class="metric"><span>ARTWORKS LIVE</span><b>'+data.works.length+'</b></div></div><div class="mini-cards"><div class="mini lime"><span>COLLECTOR LEADS</span><b>'+data.leads.length+'</b><div class="bar"><i></i></div></div><div class="mini aqua"><span>SPACE READINESS</span><b>86%</b><div class="bar"><i></i></div></div></div></div></section><aside class="showcase"><div class="section-title"><h2>Showing now</h2><button class="link-btn" onclick="go(\'artworks\')">See all</button></div>'+data.works.slice(0,2).map((w,i)=>'<button class="work-card" onclick="openArtwork('+i+')"><div class="work-thumb '+(i?'two':'')+'"'+artImageStyle(w.image)+'></div><b>'+escape(w.name)+'</b><small>'+escape(w.artist)+' · '+escape(w.price)+'</small></button>').join('')+'</aside></div><div class="below"><article class="card brand-card"><div class="eyebrow">YOUR GALLERY</div><h2>Make every room feel considered.</h2><p>Set an exhibition atmosphere before you invite your collectors into it.</p><button class="link-btn" onclick="go(\'theme\')">Explore gallery themes →</button></article><article class="card activity"><div class="section-title"><h2>Curator activity</h2><button class="link-btn" onclick="go(\'artists\')">Manage artists</button></div>'+data.artists.slice(0,3).map(a=>'<div class="activity-row"><span class="tiny-av">'+escape(a.name.slice(0,1))+'</span><div><b>'+escape(a.name)+'</b><small>'+a.works+' works in the catalogue</small></div></div>').join('')+'</article><article class="card queue"><div class="section-title"><h2>Collector enquiries</h2><button class="link-btn" onclick="go(\'enquiries\')">Open queue</button></div>'+data.leads.slice(0,3).map((l,i)=>'<div class="lead"><span class="tiny-av">'+escape(l.name.slice(0,1))+'</span><p><b>'+escape(l.name)+'</b><small>'+escape(l.interest)+'</small></p>'+action(l.status,'advanceLead('+i+')','small')+'</div>').join('')+'</article></div>';
      $('#exhibitions').innerHTML=pageLayout('CURATION','Exhibitions','Create, prepare and publish shows.',action('<i class="hgi-stroke hgi-plus-sign"></i> New exhibition','newShow()'))+'<div class="table">'+rows('show')+'</div>';
      $('#artists').innerHTML=pageLayout('ROSTER','Artists','Your represented artists and their catalogues.',action('<i class="hgi-stroke hgi-plus-sign"></i> Add artist','newArtist()'))+'<div class="table">'+rows('artist')+'</div>';
      $('#artworks').innerHTML=pageLayout('CATALOGUE','Artworks','Price, availability and collector-ready detail.',action('<i class="hgi-stroke hgi-location-01"></i> Placement studio','go(\'placement\')','')+action('<i class="hgi-stroke hgi-plus-sign"></i> Add artwork','newWork()'))+'<div class="table">'+rows('work')+'</div>';
      $('#placement').innerHTML=pageLayout('VIRTUAL INSTALL','Placement studio','Assign each catalogue work to a wall or sculptural plinth in the virtual gallery.',action('<i class="hgi-stroke hgi-plus-sign"></i> Add artwork','newWork()'))+'<div class="placement-studio"><section class="gallery-map"><div class="eyebrow">GALLERY FLOOR PLAN</div><h2>Virtual gallery layout</h2><p>Wall works face the visitor route; sculptures use plinth positions in the central room.</p><span class="zone north">NORTH WALL</span><span class="zone south">SOUTH WALL</span><span class="zone west">WEST WALL</span><span class="zone east">EAST WALL</span><span class="zone plinth">ATRIUM<br>PLINTH</span></section><section class="card placement-list"><div class="section-title"><h2>Artwork placements</h2><span class="tag">'+data.works.length+' works</span></div>'+data.works.map((w,i)=>'<div class="row"><div><b>'+escape(w.name)+'</b><small>'+escape(w.format||'Artwork')+(w.assetName?' · 3D coverage attached':'')+'</small></div><select class="placement-select" onchange="setPlacement('+i+',this.value)">'+placementOptions(w.placement)+'</select></div>').join('')+'</section></div>';
      $('#enquiries').innerHTML=pageLayout('COLLECTORS','Collector enquiries','A simple follow-up path for every expression of interest.','')+'<div class="table">'+rows('lead')+'</div>';
      $('#theme').innerHTML=pageLayout('SPACE','Gallery themes','Preview the atmosphere before assigning it to an exhibition.','')+'<div class="theme-grid">'+[['Museum quiet','Soft stone, daylight and room to look.',''],['Nocturne','Dark walls and focused illumination.','nocturne'],['Earth room','Warm plaster and natural texture.','earth']].map(t=>'<article class="card theme-card"><div class="theme-preview '+t[2]+'"></div><div class="theme-copy"><div class="eyebrow">'+(data.theme===t[0]?'CURRENT THEME':'GALLERY THEME')+'</div><h2>'+t[0]+'</h2><p>'+t[1]+'</p>'+action(data.theme===t[0]?'Selected':'Use this theme','setTheme(\''+t[0]+'\')',data.theme===t[0]?'small':'primary small')+'</div></article>').join('')+'</div>';
      $('#settings').innerHTML=pageLayout('ADMINISTRATION','Gallery settings','Core details used across your collector experience.','<a href="profile.html" class="btn"><i class="hgi-stroke hgi-user-account"></i> Profile settings</a>')+'<div class="card"><div class="settings-grid"><label>GALLERY NAME<input id="galleryName" value="'+escape(data.settings.name)+'"></label><label>COLLECTOR CONTACT EMAIL<input id="galleryEmail" value="'+escape(data.settings.email)+'"></label></div><p>'+action('Save gallery settings','saveSettings()')+'</p></div>';
    }
    function pageLayout(kicker,title,desc,right){return '<div class="page-head"><div><div class="eyebrow">'+kicker+'</div><h1>'+title+'</h1><p>'+desc+'</p></div>'+right+'</div>'}
    function openForm(title,fields,onSave){$('#modalTitle').textContent=title;$('#form').innerHTML=fields.map(f=>{const id='field_'+f.id;if(f.type==='textarea')return '<label>'+f.label+'<textarea id="'+id+'" placeholder="'+escape(f.placeholder||'')+'">'+escape(f.value||'')+'</textarea></label>';if(f.type==='select')return '<label>'+f.label+'<select id="'+id+'">'+f.options.map(option=>'<option '+(option===(f.value||f.options[0])?'selected':'')+'>'+option+'</option>').join('')+'</select></label>';if(f.type==='file')return '<label>'+f.label+'<input id="'+id+'" type="file" accept="'+(f.accept||'image/png,image/jpeg,image/webp')+'"></label>';return '<label>'+f.label+'<input id="'+id+'" value="'+escape(f.value||'')+'" placeholder="'+escape(f.placeholder||'')+'"></label>'}).join('');$('#saveModal').style.display='inline-flex';$('#saveModal').textContent='Save';$('#saveModal').onclick=onSave;modal.showModal()}
    function newShow(){openForm('Create exhibition',[{label:'EXHIBITION TITLE',id:'title',placeholder:'New exhibition'}],()=>{data.shows.push({title:$('#field_title').value||'Untitled exhibition',status:'Draft',works:0});persist();modal.close();go('exhibitions');toast('Exhibition created.')})}
    function newArtist(){openForm('Add artist',[{label:'ARTIST NAME',id:'name',placeholder:'Full name'}],()=>{data.artists.push({name:$('#field_name').value||'Untitled artist',works:0});persist();modal.close();render();toast('Artist added.')})}
    function editArtist(i){openForm('Update artist',[{label:'ARTIST NAME',id:'name',value:data.artists[i].name}],()=>{data.artists[i].name=$('#field_name').value||data.artists[i].name;persist();modal.close();render();toast('Artist updated.')})}
    function removeArtist(i){const artist=data.artists[i];if(!confirm('Remove '+artist.name+' from the artist roster? Their artworks will remain in the catalogue as unassigned.'))return;data.works.forEach(work=>{if(work.artist===artist.name)work.artist='Unassigned'});data.artists.splice(i,1);persist();render();toast('Artist removed from roster.')}
    function fileToDataUrl(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)})}
    function newWork(){openForm('Add artwork',[{label:'ARTWORK TITLE',id:'title',placeholder:'Title'},{label:'ARTIST',id:'artist',placeholder:'Artist name'},{label:'ARTWORK TYPE',id:'format',type:'select',options:['Painting','Sculpture','Mixed media','Digital work']},{label:'EXHIBITION',id:'show',placeholder:'Optional exhibition title'},{label:'VIRTUAL GALLERY PLACEMENT',id:'placement',type:'select',options:placements},{label:'PRICE',id:'price',placeholder:'₦0'},{label:'PRIMARY ARTWORK IMAGE',id:'image',type:'file'},{label:'3D SCULPTURE COVERAGE (OPTIONAL)',id:'coverage',type:'file',accept:'.glb,.gltf,.usdz,.zip'},{label:'COLLECTOR STORY',id:'story',type:'textarea',placeholder:'Share the story, process or meaning behind this work.'}],async()=>{const imageFile=$('#field_image').files[0],coverageFile=$('#field_coverage').files[0];if(imageFile&&imageFile.size>1500000){toast('Please choose an image below 1.5 MB.');return}if(coverageFile&&coverageFile.size>3000000){toast('Please choose a 3D coverage file below 3 MB.');return}const image=imageFile?await fileToDataUrl(imageFile):'';data.works.push({name:$('#field_title').value||'Untitled work',artist:$('#field_artist').value||'Unassigned',format:$('#field_format').value,show:$('#field_show').value||'',placement:$('#field_placement').value,price:$('#field_price').value||'Price on request',status:'Available',image,assetName:coverageFile?coverageFile.name:'',story:$('#field_story').value||'',note:'New catalogue entry'});persist();modal.close();go('placement');toast('Artwork added and placed in gallery.')})}
    function removeArtwork(i){const work=data.works[i];if(!confirm('Remove “'+work.name+'” from the artwork catalogue? This cannot be undone.'))return;data.works.splice(i,1);persist();render();toast('Artwork removed from catalogue.')}
    function openArtwork(i){const w=data.works[i];$('#modalTitle').textContent=w.name;$('#form').innerHTML='<div class="modal-art"><div class="art-large"'+artImageStyle(w.image)+'></div><div><div class="eyebrow">'+escape(w.status)+(w.show?' · '+escape(w.show):'')+'</div><p><b>'+escape(w.artist)+'</b></p><p>'+escape(w.format||'Artwork')+(w.placement?' · '+escape(w.placement):'')+'</p><p>'+escape(w.note||'Catalogue artwork')+'</p><p>'+((w.assetName)?'<span class="tag">3D coverage: '+escape(w.assetName)+'</span>':'')+'</p><h2>'+escape(w.price)+'</h2><button class="btn primary" onclick="toggleReserve('+i+')">'+(w.status==='Available'?'Mark as reserved':'Mark as available')+'</button></div></div>'+(w.story?'<div><div class="eyebrow" style="margin-top:20px">ARTWORK STORY</div><p style="line-height:1.6;color:#536467">'+escape(w.story).replace(/\n/g,'<br>')+'</p></div>':'');$('#saveModal').style.display='none';modal.showModal()}
    function toggleReserve(i){data.works[i].status=data.works[i].status==='Available'?'Reserved':'Available';persist();modal.close();render();toast('Artwork status updated.')}
    function setPlacement(i,placement){data.works[i].placement=placement;persist();toast('Placement updated.')}
    function advanceLead(i){const state=data.leads[i].status;data.leads[i].status=state==='New'?'Contacted':state==='Contacted'?'Resolved':'New';persist();render();toast('Lead marked '+data.leads[i].status+'.')}
    function setTheme(name){data.theme=name;persist();render();toast('Default theme updated.')}
    function saveSettings(){data.settings.name=$('#galleryName').value;data.settings.email=$('#galleryEmail').value;persist();toast('Gallery settings saved.')}
    document.querySelectorAll('[data-page]').forEach(button=>button.addEventListener('click',()=>go(button.dataset.page)));
    addEventListener('hashchange',()=>{page=location.hash.slice(1)||'overview';render()});render();
  </script>
</body>
</html>
