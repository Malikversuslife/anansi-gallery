<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Profile settings · Anansi</title>
  <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono&display=swap">
  <style>
    :root{--ink:#1c2828;--muted:#7e8b8e;--line:#e4eaeb;--teal:#347d78}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#dcecee,#c3dcdf);color:var(--ink);font:13px 'DM Sans',sans-serif}body:after{content:"";position:fixed;inset:0;background:linear-gradient(135deg,#fff8 1px,transparent 1px);background-size:170px 170px;opacity:.24;z-index:-1;pointer-events:none}.shell{width:min(1000px,calc(100% - 64px));min-height:calc(100vh - 64px);margin:32px auto;background:#f9fcfded;border:1px solid #fff;border-radius:28px;box-shadow:0 28px 70px #32565a2e;overflow:hidden}.topbar{height:72px;padding:0 28px;border-bottom:1px solid var(--line);display:flex;align-items:center}.brand{font-size:22px;letter-spacing:-1px;font-weight:700}.brand i{font-size:18px;color:var(--teal);margin-right:4px}.back{margin-left:auto;color:var(--teal);font-weight:600;font-size:12px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}.content{padding:30px}.hero{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.eyebrow{font:10px 'DM Mono';letter-spacing:1px;color:var(--teal);margin-bottom:8px}.hero h1{font-size:29px;letter-spacing:-1.2px;margin:0}.hero p{color:var(--muted);margin:5px 0 0}.identity{display:flex;align-items:center;gap:15px;padding:18px;background:linear-gradient(140deg,#fff,#eef9fa);border:1px solid var(--line);border-radius:17px}.avatar{height:64px;width:64px;display:grid;place-items:center;border-radius:50%;background:#c9e2de;color:#22615d;font-size:20px;font-weight:700}.identity b{font-size:15px;display:block}.identity small{color:var(--muted);display:block;margin-top:3px}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;margin-top:18px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:18px}.card h2{font-size:16px;letter-spacing:-.3px;margin:0 0 18px}.field{margin-bottom:13px}.field label{display:block;font:10px 'DM Mono';letter-spacing:.7px;color:var(--muted)}input[type=text],input[type=email]{width:100%;height:42px;margin-top:7px;padding:0 12px;border:1px solid var(--line);border-radius:8px;font:13px 'DM Sans';color:var(--ink)}.switch{padding:12px 0;border-top:1px solid #edf1f1;display:flex;align-items:center;justify-content:space-between;color:#405357}.switch:first-of-type{border:0}.switch input{appearance:none;width:34px;height:19px;border-radius:12px;background:#d9e1e2;position:relative;cursor:pointer}.switch input:after{content:"";position:absolute;width:13px;height:13px;top:3px;left:3px;border-radius:50%;background:#fff;transition:.18s}.switch input:checked{background:var(--teal)}.switch input:checked:after{left:18px}.button-row{display:flex;align-items:center;gap:10px;margin-top:20px}.btn{height:40px;padding:0 15px;border:1px solid #dfe8e9;background:#fff;border-radius:9px;color:#395052;font:600 12px 'DM Sans';display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer}.btn.primary{color:#fff;background:var(--teal);border-color:var(--teal)}.status{color:var(--teal);font-size:11px}.activity{margin:0;padding:0;list-style:none}.activity li{padding:12px 0;border-top:1px solid #edf1f1;color:#536467}.activity li:first-child{border:0}.activity i{color:var(--teal);margin-right:7px}@media(max-width:700px){.shell{width:calc(100% - 24px);min-height:calc(100vh - 24px);margin:12px auto}.content{padding:20px}.hero{align-items:flex-start;gap:14px;flex-direction:column}.grid{grid-template-columns:1fr}.topbar{padding:0 20px}}
    html,body{width:100%;height:100%;background:#f9fcfd}
    body{overflow:hidden;background:#f9fcfd}
    body:after{display:none}
    .shell{position:fixed;inset:0;width:100%!important;height:100dvh;min-height:100dvh;margin:0!important;border:0;border-radius:0;overflow:hidden;background:#f9fcfd}
    .topbar{position:relative;top:auto;z-index:20;background:#fbfdfdde;box-shadow:0 1px 0 var(--line)}
    .content{height:calc(100dvh - 72px);overflow-y:auto}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar"><div class="brand"><i class="hgi-stroke hgi-sparkles"></i>anansi</div><a class="back" href="./#overview"><i class="hgi-stroke hgi-arrow-left-01"></i> Back to dashboard</a></header>
    <main class="content">
      <section class="hero"><div><div class="eyebrow">OWNER WORKSPACE</div><h1>Profile settings</h1><p>Manage the director profile shown across your gallery workspace.</p></div><div class="identity"><span class="avatar" id="avatar">AO</span><div><b id="displayName">Adesewa Okafor</b><small id="displayRole">Gallery Director · Anansi Gallery</small></div></div></section>
      <div class="grid">
        <section class="card"><h2>Your details</h2><div class="field"><label>FULL NAME</label><input id="name" type="text" value="Adesewa Okafor"></div><div class="field"><label>ROLE</label><input id="role" type="text" value="Gallery Director"></div><div class="field"><label>EMAIL</label><input id="email" type="email" value="hello@anansi.gallery"></div><div class="button-row"><button class="btn primary" id="save"><i class="hgi-stroke hgi-floppy-disk"></i> Save profile</button><span class="status" id="status"></span></div></section>
        <aside><section class="card"><h2>Notifications</h2><label class="switch">New collector enquiries <input id="enquiries" type="checkbox" checked></label><label class="switch">Artwork interest updates <input id="interest" type="checkbox" checked></label><label class="switch">Weekly gallery report <input id="report" type="checkbox"></label></section><section class="card" style="margin-top:18px"><h2>Workspace</h2><ul class="activity"><li><i class="hgi-stroke hgi-clock-01"></i>Last signed in today</li><li><i class="hgi-stroke hgi-paint-board"></i>Theme updated recently</li></ul><a class="btn" href="./#settings"><i class="hgi-stroke hgi-settings-01"></i> Gallery settings</a></section></aside>
      </div>
    </main>
  </div>
  <script>
    let p=JSON.parse(localStorage.getItem('anansiProfile')||'null')||{name:'Adesewa Okafor',role:'Gallery Director',email:'hello@anansi.gallery',enquiries:true,interest:true,report:false};
    for(const key in p){const el=document.getElementById(key);if(el)el.type==='checkbox'?el.checked=p[key]:el.value=p[key]}
    function sync(){displayName.textContent=name.value;displayRole.textContent=role.value+' · Anansi Gallery';avatar.textContent=name.value.split(' ').map(x=>x[0]).slice(0,2).join('')}
    sync();
    save.onclick=()=>{p={name:name.value,role:role.value,email:email.value,enquiries:enquiries.checked,interest:interest.checked,report:report.checked};localStorage.setItem('anansiProfile',JSON.stringify(p));sync();status.textContent='Profile saved';setTimeout(()=>status.textContent='',1800)}
  </script>
</body>
</html>
