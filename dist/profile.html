<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css"><title>Profile · Anansi</title><style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono&display=swap');:root{--bg:#f5f3ee;--paper:#fffefa;--ink:#252724;--line:#dddcd4;--muted:#757870;--teal:#337e78}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px 'DM Sans';color:var(--ink)}main{max-width:850px;margin:auto;padding:48px 28px}.back{color:var(--teal);text-decoration:none;font-size:12px;font-weight:600}.head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:26px 0}.avatar{width:88px;height:88px;border-radius:50%;background:#d8e5df;color:var(--teal);display:grid;place-items:center;font-size:26px;font-weight:700}.identity{display:flex;gap:18px;align-items:center}.identity h1{margin:0;font-size:30px}.identity p{margin:4px 0;color:var(--muted)}.btn{height:40px;padding:0 15px;border-radius:6px;border:1px solid var(--line);background:var(--paper);font:600 12px 'DM Sans'}.primary{background:var(--teal);color:#fff;border-color:var(--teal)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:28px}.card{background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:20px}.card h2{font-size:16px;margin:0 0 18px}.field{margin-bottom:14px}.field label{display:block;font:10px 'DM Mono';letter-spacing:.8px;color:var(--muted);margin-bottom:6px}.field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:6px;font:14px 'DM Sans'}.switch{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}.switch:last-child{border:0}.switch input{accent-color:var(--teal)}.status{color:#337e78;font-size:12px;margin-left:10px}@media(max-width:650px){.grid{grid-template-columns:1fr}.head{align-items:flex-start;gap:15px;flex-direction:column}}</style></head><body><main><a class="back" href="./#overview"><i class="hgi-stroke hgi-arrow-left-01"></i> Back to dashboard</a><header class="head"><div class="identity"><div class="avatar" id="avatar">AO</div><div><h1 id="displayName">Adesewa Okafor</h1><p id="displayRole">Gallery Director · Anansi Gallery</p></div></div><button class="btn primary" id="save">Save profile</button></header><div class="grid"><section class="card"><h2>Profile settings</h2><div class="field"><label>FULL NAME</label><input id="name" value="Adesewa Okafor"></div><div class="field"><label>ROLE</label><input id="role" value="Gallery Director"></div><div class="field"><label>EMAIL</label><input id="email" value="hello@anansi.gallery"></div><span class="status" id="status"></span></section><section class="card"><h2>Notifications</h2><label class="switch">New collector enquiries <input id="enquiries" type="checkbox" checked></label><label class="switch">Artwork interest updates <input id="interest" type="checkbox" checked></label><label class="switch">Weekly gallery report <input id="report" type="checkbox"></label></section><section class="card"><h2>Profile activity</h2><p>Last signed in today</p><p>Created current exhibition</p><p>Updated gallery theme</p></section><section class="card"><h2>Account</h2><p>Private owner workspace</p><button class="btn" onclick="location.href='./#settings'">Gallery settings</button></section></div></main><script>let p=JSON.parse(localStorage.getItem('anansiProfile')||'null')||{name:'Adesewa Okafor',role:'Gallery Director',email:'hello@anansi.gallery',enquiries:true,interest:true,report:false};for(let k in p){let e=document.getElementById(k);if(e)e.type==='checkbox'?e.checked=p[k]:e.value=p[k]}function sync(){displayName.textContent=name.value;displayRole.textContent=role.value+' · Anansi Gallery';avatar.textContent=name.value.split(' ').map(x=>x[0]).join('').slice(0,2)}sync();save.onclick=()=>{p={name:name.value,role:role.value,email:email.value,enquiries:enquiries.checked,interest:interest.checked,report:report.checked};localStorage.setItem('anansiProfile',JSON.stringify(p));sync();status.textContent='Profile saved';setTimeout(()=>status.textContent='',2000)}</script></body></html>
